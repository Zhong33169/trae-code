[tool.poetry]
name = "energy-bill-backend"
version = "0.1.0"
description = "Energy Bill Management Backend"
authors = ["Trae"]

[tool.poetry.dependencies]
python = "^3.10"
litestar = "^2.0"
uvicorn = {extras = ["standard"], version = "^0.24"}
sqlalchemy = "^2.0"
pydantic = "^2.0"
pydantic-settings = "^2.0"
python-jose = {extras = ["crypt"], version = "^3.3"}
passlib = {extras = ["bcrypt"], version = "^1.7"}
python-multipart = "^0.0.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
