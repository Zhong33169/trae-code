[package]
name = "bank-inspection-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
argon2 = "0.5"
rand = "0.8"
jsonwebtoken = "9"
anyhow = "1"
thiserror = "1"
env_logger = "0.11"
log = "0.4"
dotenvy = "0.15"

[dev-dependencies]
