[package]
name = "complaint-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix-cors = "0.7"
actix-multipart = "0.6"
actix-files = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"
argon2 = "0.5"
rand = "0.8"
env_logger = "0.11"
log = "0.4"
futures-util = "0.3"
tokio = { version = "1.0", features = ["full"] }

[[bin]]
name = "complaint-backend"
path = "src/main.rs"
