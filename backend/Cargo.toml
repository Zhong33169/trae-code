[package]
name = "scf-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
rocket = { version = "0.5.0", features = ["json"] }
rocket_cors = "0.6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31.0", features = ["bundled"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.24.0"
jsonwebtoken = "9.2.0"
chrono = { version = "0.4.31", features = ["serde"] }
bcrypt = "0.15.1"
uuid = { version = "1.6.1", features = ["v4", "serde"] }
anyhow = "1.0.75"
thiserror = "1.0.50"

[profile.release]
opt-level = 3
