[package]
name = "garment-sampling-tracker"
version = "1.0.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix-cors = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
argon2 = "0.5"
rand = "0.8"
jsonwebtoken = "9.0"
thiserror = "1.0"
anyhow = "1.0"
dotenvy = "0.15"
env_logger = "0.11"
log = "0.4"
tokio = { version = "1.0", features = ["full"] }
data-encoding = "2.5"
futures-util = "0.3"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
